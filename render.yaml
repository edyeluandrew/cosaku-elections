services:
  - type: web
    name: cosaku-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 587
      - key: UPLOAD_DIR
        value: src/uploads
      # The following must be set manually in Render dashboard (Environment tab):
      # DATABASE_URL, JWT_SECRET, CLIENT_URL,
      # EMAIL_USER, EMAIL_PASS, EMAIL_FROM,
      # DEFAULT_ADMIN_NAME, DEFAULT_ADMIN_EMAIL, DEFAULT_ADMIN_PASSWORD
